[project]
name = "quantilica-catalog"
version = "0.2.1"
description = "Unified data catalog and canonical observation model for Quantilica"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "data",
    "open-data",
    "brazil",
    "quantilica",
    "catalog",
    "data-model",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
    "quantilica-analytics>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/quantilica-catalog"
Repository = "https://github.com/Quantilica/quantilica-catalog"
Issues = "https://github.com/Quantilica/quantilica-catalog/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrar (str, Enum) para StrEnum muda o resultado de str() dos membros —
# é breaking para consumidores; fica para um major deliberado.
"src/quantilica/catalog/enums.py" = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantilica/catalog"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
